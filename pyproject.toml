[project]
name = "reconcile"
version = "0.1.0"
description = "Personal check register for reconciling a checking account"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
