# Generic compose file, driven by a .env. The prod server doesn't use it:
# scripts/update-app.sh writes its own docker-compose.yaml pinned to a tag.
# To run it this way instead, put this file and a .env next to each other:
#
#   TZ=America/Chicago
#   RECONCILE_TAG=v0.1.0      # a git tag; defaults to latest
#
# It publishes no ports. cloudflared, in its own container, reaches it at
# http://reconcile:8000 over the external cf-tunnel network. Create that once:
#   docker network create cf-tunnel
#
# Deploy or update:
#   docker compose pull && docker compose up -d
# Roll back: set RECONCILE_TAG to an older tag and run the same command.

services:
  reconcile:
    image: docker.io/xadamz23/reconcile:${RECONCILE_TAG:-latest}
    platform: linux/amd64
    container_name: reconcile
    restart: unless-stopped
    environment:
      # Sets what "today" means (default transaction date, the Today divider).
      TZ: ${TZ:-UTC}
    networks:
      - cf-tunnel
    volumes:
      - reconcile-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reconcile-data:

networks:
  cf-tunnel:
    external: true
