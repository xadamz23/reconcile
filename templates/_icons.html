{# Inline SVG icons, 24px grid, stroke = currentColor. #}
{% macro icon(name, label=None) -%}
<svg class="icon icon-{{ name }}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}>
{%- if name == 'search' -%}<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>
{%- elif name == 'more' -%}<circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/>
{%- elif name == 'plus' -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'close' -%}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'check' -%}<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == 'back' -%}<path d="M15 5l-7 7 7 7"/>
{%- elif name == 'trash' -%}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
{%- elif name == 'download' -%}<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == 'scale' -%}<path d="M12 4v16M7 20h10M5 8h14M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z"/>
{%- elif name == 'eye' -%}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'lock' -%}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- endif -%}
</svg>
{%- endmacro %}
