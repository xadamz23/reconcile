{% extends "base.html" %}
{% block title %}Offline{% endblock %}
{% block body_class %}page-setup{% endblock %}
{% block body %}
<main class="setup">
  <img class="setup-mark" src="{{ static_url('icons/icon.svg') }}" alt="" width="72" height="72">
  <h1>You're offline</h1>
  <p class="setup-lede">Reconcile needs a connection to read and save your register. Reconnect and try again.</p>
  <button class="btn btn-primary btn-wide" type="button" onclick="location.reload()">Try again</button>
</main>
{% endblock %}
