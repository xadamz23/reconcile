{# Form panel (a transaction, or a bill on the Bills page): a full-screen sheet on mobile, a drawer over a scrim on
   desktop. Empty until a form loads into it, from a row, the tab bar's + or the
   desktop New transaction button. #}
<div class="panel-scrim" data-panel-close></div>
<aside id="panel" class="panel glass-strong" aria-label="{{ panel_label | default('Transaction') }}" aria-hidden="true">
  <div id="panel-body" class="panel-body"></div>
</aside>
